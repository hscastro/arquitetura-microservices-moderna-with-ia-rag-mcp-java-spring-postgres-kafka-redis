spring:
  application:
    name: order-service

  server:
    port: 8083


  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:order_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:1234567}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      database-platform=org:
        hibernate:
          dialect:
            PostgreSQLDialect:
