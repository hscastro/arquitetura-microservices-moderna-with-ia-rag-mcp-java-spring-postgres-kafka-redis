spring:
  application:
    name: product-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:product-db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:1234567}

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      database-platform=org:
        hibernate:
          dialect:
            PostgreSQLDialect:


server:
  port: 8080