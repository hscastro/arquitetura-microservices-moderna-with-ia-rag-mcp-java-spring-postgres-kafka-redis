version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

  product-service:
    build: services/microservice-test
    ports:
      - "8081:8081"

  inventory-service:
    build: services/inventory-service-test
    ports:
      - "8082:8082"

  agent-service:
    build: services/agent-service-test
    ports:
      - "8090:8090"